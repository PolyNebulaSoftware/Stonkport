name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Export & Deploy
    runs-on: ubuntu-latest
    # godot-ci image ships the editor on PATH plus the matching export
    # templates at /root/.local/share/godot/export_templates/4.7.2.stable/
    container:
      image: barichello/godot-ci:4.7.2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import assets (fresh checkout)
        run: godot --headless --path . --import

      - name: Export Web build
        run: godot --headless --path . --export-release "Web" web_dist/index.html

      - name: Prepare Pages artifact
        run: touch web_dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
