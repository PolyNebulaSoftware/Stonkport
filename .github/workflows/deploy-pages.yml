name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  deploy:
    name: Export & Deploy
    runs-on: ubuntu-latest
    # godot-ci image ships the editor on PATH plus the matching export
    # templates at /root/.local/share/godot/export_templates/4.7.2.stable/
    container:
      image: barichello/godot-ci:4.7.2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Align export templates with runtime HOME
        run: |
          # The image preinstalls templates under /root, but GitHub Actions
          # containers run with HOME=/github/home, so Godot looks elsewhere.
          SRC=$(find /root /usr/local /opt -maxdepth 6 -type d \
            -name "${GODOT_VERSION}.stable" -path "*export_templates*" 2>/dev/null | head -n1)
          echo "template source: ${SRC:-<not found>}"
          if [ -z "$SRC" ]; then echo "No export templates in image"; exit 1; fi
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r "$SRC" "$HOME/.local/share/godot/export_templates/"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head

      - name: Import assets (fresh checkout)
        run: godot --headless --path . --import

      - name: Export Web build
        run: |
          mkdir -p web_dist
          godot --headless --path . --export-release "Web" web_dist/index.html

      - name: Prepare Pages artifact
        run: touch web_dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
