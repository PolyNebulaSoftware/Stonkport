<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>$GODOT_PROJECT_NAME</title>
	$GODOT_HEAD_INCLUDE
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body {
			width: 100%; height: 100%; overflow: hidden;
			background-color: #0d1117;
			touch-action: none; overscroll-behavior: none;
		}
		/* Godot (canvasResizePolicy 1) owns the canvas inline size; the flex
		   wrapper just gives it the full page to measure against. */
		#app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
		#status-overlay {
			position: absolute; inset: 0; z-index: 10;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			gap: 14px; color: #e6edf3;
			font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px;
			background-color: #0d1117;
		}
		#status-logo { width: 88px; height: 88px; filter: drop-shadow(0 6px 18px rgba(88, 166, 255, 0.25)); }
		#progress-track { width: 280px; height: 6px; border-radius: 3px; background-color: #21262d; overflow: hidden; }
		#progress-bar { width: 0%; height: 100%; border-radius: 3px; background-color: #58a6ff; transition: width 0.15s ease-out; }
		#canvas { width: 100%; height: 100%; display: block; background-color: #0d1117; outline: none; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="canvas"></canvas>
		<div id="status-overlay">
			<svg id="status-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Stonkport logo">
				<rect width="128" height="128" rx="20" fill="#161b22"/>
				<rect x="8" y="8" width="112" height="112" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>
				<path d="M20 44h88M20 72h88M20 100h88" stroke="#30363d" stroke-width="1" opacity="0.5"/>
				<line x1="36" y1="30" x2="36" y2="96" stroke="#f85149" stroke-width="3"/>
				<rect x="28" y="46" width="16" height="34" rx="2" fill="#f85149"/>
				<line x1="64" y1="22" x2="64" y2="86" stroke="#3fb950" stroke-width="3"/>
				<rect x="56" y="36" width="16" height="32" rx="2" fill="#3fb950"/>
				<line x1="92" y1="34" x2="92" y2="102" stroke="#58a6ff" stroke-width="3"/>
				<rect x="84" y="56" width="16" height="30" rx="2" fill="#58a6ff"/>
			</svg>
			<div id="status-label">Loading Stonkport&hellip;</div>
			<div id="progress-track"><div id="progress-bar"></div></div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const statusOverlay = document.getElementById('status-overlay');
		const statusLabel = document.getElementById('status-label');
		const progressBar = document.getElementById('progress-bar');

		const engine = new Engine(GODOT_CONFIG);
		engine.startGame({
			onProgress: function (current, total) {
				if (total > 0) {
					const pct = Math.round((current / total) * 100);
					progressBar.style.width = pct + '%';
					statusLabel.textContent = 'Loading\u2026 ' + pct + '%';
				} else {
					statusLabel.textContent = 'Loading\u2026 ' + current + ' bytes';
				}
			},
		}).then(function () {
			statusOverlay.style.display = 'none';
		}).catch(function (err) {
			statusLabel.textContent = 'Failed to start: ' + err;
			progressBar.style.backgroundColor = '#f85149';
		});
	</script>
</body>
</html>
