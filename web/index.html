<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>$GODOT_PROJECT_NAME</title>
	$GODOT_HEAD_INCLUDE
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; background-color: #0d1117; }
		#app { display: flex; flex-direction: column; width: 100%; height: 100%; }
		#status-overlay {
			position: absolute; inset: 0; z-index: 10;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			gap: 14px; color: #e6edf3;
			font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px;
			background-color: #0d1117;
		}
		#progress-track { width: 280px; height: 6px; border-radius: 3px; background-color: #21262d; overflow: hidden; }
		#progress-bar { width: 0%; height: 100%; border-radius: 3px; background-color: #58a6ff; transition: width 0.15s ease-out; }
		#canvas { width: 100%; height: 100%; display: block; background-color: #0d1117; outline: none; }
	</style>
</head>
<body>
	<div id="app">
		<canvas id="canvas"></canvas>
		<div id="status-overlay">
			<div id="status-label">Loading Stonkport&hellip;</div>
			<div id="progress-track"><div id="progress-bar"></div></div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const statusOverlay = document.getElementById('status-overlay');
		const statusLabel = document.getElementById('status-label');
		const progressBar = document.getElementById('progress-bar');

		const engine = new Engine(GODOT_CONFIG);
		engine.startGame({
			onProgress: function (current, total) {
				if (total > 0) {
					const pct = Math.round((current / total) * 100);
					progressBar.style.width = pct + '%';
					statusLabel.textContent = 'Downloading\u2026 ' + pct + '%';
				} else {
					statusLabel.textContent = 'Downloading\u2026 ' + current + ' bytes';
				}
			},
		}).then(function () {
			statusOverlay.style.display = 'none';
		}).catch(function (err) {
			statusLabel.textContent = 'Failed to start: ' + err;
			progressBar.style.backgroundColor = '#f85149';
		});
	</script>
</body>
</html>
